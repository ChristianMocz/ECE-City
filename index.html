<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ECE City</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1a1c2c; overflow: hidden; height: 100%; }
      canvas { display: block; margin: 0 auto; touch-action: none; image-rendering: pixelated; }
      #load-error { color: #fff; font: 18px/1.5 Arial, sans-serif; max-width: 560px; margin: 80px auto; padding: 0 16px; }
    </style>
  </head>
  <body>
    <!-- Phaser 3.90.0 is bundled in lib/ (MIT, see lib/PHASER-LICENSE.md) so
         the game works with no internet connection — e.g. on a classroom
         laptop. If that file is missing, fall back to the same pinned
         version on the CDN. -->
    <script src="./lib/phaser.min.js"></script>
    <script>
      if (!window.Phaser) {
        document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>');
      }
    </script>
    <script>
      if (!window.Phaser) {
        document.write('<div id="load-error"><b>ECE City couldn\'t start.</b><br>The game engine file <code>lib/phaser.min.js</code> is missing and the internet copy couldn\'t be reached. Put the file back, or connect to the internet and reload.</div>');
      }
    </script>
    <!-- Plain classic scripts, not ES modules: modules are blocked entirely
         by browsers when this file is opened via file:// (double-clicked),
         with no server-side workaround. Order matters — each file defines
         top-level globals the next one depends on. -->
    <script src="./src/art/font.js"></script>
    <script src="./src/art/pixelart.js"></script>
    <script src="./src/art/gameart.js"></script>
    <script src="./src/art/worldart.js"></script>

    <script src="./src/ui/levelmap.js"></script>
